[package]
name = "agc"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
argh = "0.1"
anyhow = "1"
regex = "1"

[[test]]
name = "agc"
harness = false

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[dev-dependencies]
cucumber = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
