[package]
name = "agc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
futures = "0.3"

[[test]]
name = "agc"
harness = false

[dev-dependencies]
cucumber = "0.23"
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
